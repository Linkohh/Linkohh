<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 850 50'
    style='background-color: #00000000;'
    width='850px' height='50px'>

    <style>
@font-face {
  font-family: 'Fira Code';
  font-style: normal;
  font-weight: 600;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
text {
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    animation: breathGlow 6s ease-in-out infinite;
}
@keyframes breathGlow {
    0%, 100% { filter: drop-shadow(0 0 2px #C569DF); opacity: 0.8;}
    50% { filter: drop-shadow(0 0 5px #C569DF); opacity: 1;}
}
</style>

                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d3.end'
                    dur='6000ms' fill='remove'
                    values='m0,25 h0 ; m0,25 h850 ; m0,25 h850 ; m0,25 h0' keyTimes='0;0.66666666666667;0.83333333333333;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#C569DF' font-size='22'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            Turning Problems Into Digital Tools
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='6000ms' fill='remove'
