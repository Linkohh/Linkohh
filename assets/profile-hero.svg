<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Linkohh profile banner</title>
  <desc id="desc">Dark profile banner with a pink and purple gradient, geometric details, and the text Linkohh, IT Professional, App Builder, and AI-Curious Problem Solver.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="1180" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0612"/>
      <stop offset="0.52" stop-color="#130A1F"/>
      <stop offset="1" stop-color="#1C0E2A"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 130) rotate(18) scale(420 240)">
      <stop stop-color="#FF4FB4" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FF4FB4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 120) rotate(12) scale(360 220)">
      <stop stop-color="#8B5CF6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="210" y1="98" x2="1070" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF77C8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="120" y1="120" x2="400" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#FF77C8"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#FF4FB4" flood-opacity="0.5"/>
    </filter>
    <clipPath id="textClip">
      <text x="120" y="190" font-family="Georgia, Times New Roman, serif" font-size="86" font-weight="700">Linkohh</text>
    </clipPath>
    <linearGradient id="shineGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulse-left {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 1; }
    }
    @keyframes pulse-right {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.1; }
    }
    @keyframes subtle-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    @keyframes pulse-grid {
      0%, 100% { opacity: 0.1; }
      50% { opacity: 0.45; }
    }
    .glow-left { animation: pulse-left 4s ease-in-out infinite; }
    .glow-right { animation: pulse-right 5.5s ease-in-out infinite; }
    .floating-geometry { animation: subtle-float 4.5s ease-in-out infinite; }
    .pulse-grid { animation: pulse-grid 7s ease-in-out infinite; }
    @keyframes glass-pulse {
      0%, 100% { stroke-opacity: 0.2; }
      50% { stroke-opacity: 1; }
    }
    .focus-card { animation: glass-pulse 6s ease-in-out infinite; }
    text { text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }
    @keyframes shine-sweep {
      0%, 15% { transform: translateX(30px) skewX(-25deg); opacity: 0; }
      18% { opacity: 0.85; }
      30% { transform: translateX(500px) skewX(-25deg); opacity: 0; }
      100% { transform: translateX(500px) skewX(-25deg); opacity: 0; }
    }
    .shine-beam { animation: shine-sweep 8s linear infinite; }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .blinking-cursor { animation: blink 1.1s infinite; font-weight: bold; fill: #FF77C8; }
    @keyframes particle-drift {
      0% { transform: translateY(0); opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% { transform: translateY(-40px); opacity: 0; }
    }
    .p1 { animation: particle-drift 6s linear infinite; }
    .p2 { animation: particle-drift 8s linear infinite 2s; }
    .p3 { animation: particle-drift 7s linear infinite 4s; }
    .p4 { animation: particle-drift 9s linear infinite 1s; }
    .p5 { animation: particle-drift 10s linear infinite 3s; }
    .p6 { animation: particle-drift 5s linear infinite 5s; }
    @keyframes marquee-scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-800px); }
    }
    .marquee { animation: marquee-scroll 15s linear infinite; }
    .marquee-text { font-family: 'Courier New', Consolas, monospace; font-size: 14px; font-weight: bold; fill: #D9B8F5; letter-spacing: 2px; }
  </style>

  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="28" fill="url(#glowLeft)" class="glow-left"/>
  <rect width="1280" height="420" rx="28" fill="url(#glowRight)" class="glow-right"/>

  <g class="particles" fill="#FF4FB4">
    <circle cx="150" cy="120" r="1.5" class="p1" />
    <circle cx="280" cy="300" r="1" class="p2" />
    <circle cx="450" cy="80" r="2" class="p3" />
    <circle cx="650" cy="250" r="1.5" class="p4" />
    <circle cx="820" cy="140" r="1" class="p5" />
    <circle cx="200" cy="350" r="2" class="p6" />
    <circle cx="350" cy="180" r="1" class="p1" style="animation-delay: 3s"/>
    <circle cx="550" cy="320" r="1.5" class="p2" style="animation-delay: 1s"/>
    <circle cx="750" cy="90" r="2" class="p3" style="animation-delay: 4s"/>
    <circle cx="950" cy="280" r="1" class="p4" style="animation-delay: 2s"/>
    <circle cx="1150" cy="160" r="1.5" class="p5" style="animation-delay: 5s"/>
  </g>

  <g opacity="0.22" class="pulse-grid">
    <path d="M0 56H1280" stroke="#F5E9FF" stroke-width="1"/>
    <path d="M0 112H1280" stroke="#F5E9FF" stroke-width="1"/>
    <path d="M0 168H1280" stroke="#F5E9FF" stroke-width="1"/>
    <path d="M0 224H1280" stroke="#F5E9FF" stroke-width="1"/>
    <path d="M0 280H1280" stroke="#F5E9FF" stroke-width="1"/>
    <path d="M0 336H1280" stroke="#F5E9FF" stroke-width="1"/>
    <path d="M120 0V420" stroke="#F5E9FF" stroke-width="1"/>
    <path d="M240 0V420" stroke="#F5E9FF" stroke-width="1"/>
    <path d="M360 0V420" stroke="#F5E9FF" stroke-width="1"/>
    <path d="M480 0V420" stroke="#F5E9FF" stroke-width="1"/>
    <path d="M600 0V420" stroke="#F5E9FF" stroke-width="1"/>
    <path d="M720 0V420" stroke="#F5E9FF" stroke-width="1"/>
    <path d="M840 0V420" stroke="#F5E9FF" stroke-width="1"/>
    <path d="M960 0V420" stroke="#F5E9FF" stroke-width="1"/>
    <path d="M1080 0V420" stroke="#F5E9FF" stroke-width="1"/>
    <path d="M1200 0V420" stroke="#F5E9FF" stroke-width="1"/>
  </g>

  <g opacity="0.9" class="floating-geometry">
    <rect x="74" y="68" width="6" height="148" rx="3" fill="#FF77C8"/>
    <rect x="86" y="68" width="6" height="72" rx="3" fill="#8B5CF6"/>
    <circle cx="1060" cy="102" r="58" stroke="url(#stroke)" stroke-width="2"/>
    <circle cx="1060" cy="102" r="78" stroke="#F5E9FF" stroke-opacity="0.14"/>
    <path d="M820 278C892 244 957 232 1124 250" stroke="url(#stroke)" stroke-width="2"/>
    <path d="M915 298H1160" stroke="#FF77C8" stroke-opacity="0.4" stroke-width="2"/>
  </g>

  <g fill="#F8EEFF">
    <text x="120" y="90" font-family="Verdana, Geneva, sans-serif" font-size="15" letter-spacing="3.8" fill="#F4C7E7">
      LINCOLN'S WORKSPACE
    </text>
    <g>
      <text x="120" y="190" font-family="Georgia, Times New Roman, serif" font-size="86" font-weight="700" fill="url(#textGrad)" filter="url(#glowShadow)">
        Linkohh
      </text>
      <rect class="shine-beam" x="0" y="90" width="120" height="130" fill="url(#shineGradient)" clip-path="url(#textClip)" />
    </g>
    <text x="120" y="236" font-family="Verdana, Geneva, sans-serif" font-size="24" fill="#E8D7FF">
      I.T. Professional / App Builder / AI-Curious Problem Solver<tspan class="blinking-cursor">_</tspan>
    </text>
    <text x="120" y="292" font-family="Verdana, Geneva, sans-serif" font-size="22" fill="#F6E6FF">
      Practical tools. Proactive learning. People-first problem solving.
    </text>
    <text x="120" y="330" font-family="Verdana, Geneva, sans-serif" font-size="16" fill="#CFB7E9">
      Building beyond support through modern web projects, sharper workflows, and curiosity-led execution.
    </text>
  </g>

  <g>
    <rect class="focus-card" x="960" y="176" width="290" height="132" rx="18" fill="#160D24" fill-opacity="0.9" stroke="url(#stroke)"/>
    <text x="1105" y="200" font-family="Verdana, Geneva, sans-serif" font-size="15" letter-spacing="2.6" fill="#D9B8F5" dominant-baseline="middle" text-anchor="middle">
      FOCUS
    </text>
    <text x="1105" y="229" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#FFF4FF" dominant-baseline="middle" text-anchor="middle">
      Learn fast.
    </text>
    <text x="1105" y="257" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#FFF4FF" dominant-baseline="middle" text-anchor="middle">
      Build useful things.
    </text>
    <text x="1105" y="285" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#FFF4FF" dominant-baseline="middle" text-anchor="middle">
      Keep users in view.
    </text>
  </g>
  <g>
    <rect x="0" y="380" width="1280" height="40" fill="#0A0612" fill-opacity="0.6" />
    <path d="M0 380H1280" stroke="url(#stroke)" stroke-width="1" stroke-opacity="0.3"/>
    <g class="marquee">
      <text x="0" y="405" class="marquee-text">+++ REACT NATIVE +++ TYPESCRIPT +++ PYTHON +++ AWS +++ DOCKER +++ SQL +++ GRAPHQL </text>
      <text x="800" y="405" class="marquee-text">+++ REACT NATIVE +++ TYPESCRIPT +++ PYTHON +++ AWS +++ DOCKER +++ SQL +++ GRAPHQL </text>
      <text x="1600" y="405" class="marquee-text">+++ REACT NATIVE +++ TYPESCRIPT +++ PYTHON +++ AWS +++ DOCKER +++ SQL +++ GRAPHQL </text>
      <text x="2400" y="405" class="marquee-text">+++ REACT NATIVE +++ TYPESCRIPT +++ PYTHON +++ AWS +++ DOCKER +++ SQL +++ GRAPHQL </text>
    </g>
  </g>
</svg>
